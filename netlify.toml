[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/aviso-legal"
  to = "/pages/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/aviso-legal.html"
  to = "/pages/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/politica-privacidad"
  to = "/pages/politica-privacidad.html"
  status = 200

[[redirects]]
  from = "/politica-privacidad.html"
  to = "/pages/politica-privacidad.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
