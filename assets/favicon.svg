<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Metallic gradient for the T Monogram -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d4d8e8"/>
      <stop offset="65%" stop-color="#7a8299"/>
      <stop offset="100%" stop-color="#2d3242"/>
    </linearGradient>
    <linearGradient id="silver-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8b2cc"/>
    </linearGradient>
    <linearGradient id="silver-dark" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e768b"/>
      <stop offset="100%" stop-color="#212530"/>
    </linearGradient>
    <!-- Blue Neon Glow (Chung) -->
    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#1e5eff" flood-opacity="0.9"/>
    </filter>
    <!-- Red Neon Glow (Hong) -->
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff1a40" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#0b0e15"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#1d2230" stroke-width="2"/>

  <!-- Left Octagonal Neon Line: Chung (Blue) -->
  <path d="M 64 18 L 36 28 L 18 56 L 18 72 L 36 100 L 64 110" 
        fill="none" stroke="#1e5eff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#blue-glow)"/>

  <!-- Right Octagonal Neon Line: Hong (Red) -->
  <path d="M 64 18 L 92 28 L 110 56 L 110 72 L 92 100 L 64 110" 
        fill="none" stroke="#ff1a40" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#red-glow)"/>

  <!-- Inner Octagon Shield Frame -->
  <polygon points="64,26 86,34 100,58 100,70 86,94 64,102 42,94 28,70 28,58 42,34" 
           fill="#10131a" stroke="#2e3547" stroke-width="2"/>

  <!-- Central Martial T Monogram (Metallic Bevel) -->
  <!-- Left Half (Light Reflection) -->
  <path d="M 64 36 L 28 42 L 38 52 L 56 50 L 56 92 L 64 100 Z" 
        fill="url(#silver-light)"/>
  <!-- Right Half (Shadow Reflection) -->
  <path d="M 64 36 L 100 42 L 90 52 L 72 50 L 72 92 L 64 100 Z" 
        fill="url(#silver-dark)"/>
  
  <!-- Central Ridge Accent -->
  <line x1="64" y1="36" x2="64" y2="100" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Crossbar highlight -->
  <polygon points="64,36 32,41 64,43 96,41" fill="#ffffff" opacity="0.9"/>
</svg>
